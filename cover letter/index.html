<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор супровідного листа</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #1b2540;
      --text: #eaf0ff;
      --muted: #97a3c6;
      --accent: #6d8dff;
      --accent-hover: #87a1ff;
      --border: #2a375f;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(109, 141, 255, 0.16), transparent 50%),
        radial-gradient(900px 500px at 90% -20%, rgba(105, 211, 255, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    .container {
      width: min(980px, 100%);
      background: linear-gradient(180deg, rgba(27, 37, 64, 0.75), rgba(18, 26, 43, 0.92));
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(7px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 2.2vw, 2.1rem);
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.45;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(11, 16, 32, 0.72);
      color: var(--text);
      padding: 14px 14px;
      font-size: 0.98rem;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    textarea::placeholder {
      color: #6f7ca0;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(109, 141, 255, 0.2);
      background: rgba(11, 16, 32, 0.9);
    }

    .actions {
      margin-top: 4px;
      display: flex;
      justify-content: flex-start;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--accent-hover), var(--accent));
      color: #051033;
      font-weight: 700;
      font-size: 0.96rem;
      padding: 12px 20px;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.2s ease;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
      transform: none;
      filter: grayscale(0.1);
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .result h2 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }

    .result-box {
      background: rgba(8, 12, 24, 0.78);
      border: 1px dashed #41568f;
      border-radius: 12px;
      padding: 14px;
      color: #d8e2ff;
      min-height: 88px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .loading {
      margin-top: 12px;
      display: none;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .loading.visible {
      display: inline-flex;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #3a4d82;
      border-top-color: #9cb3ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Генератор супровідного листа</h1>
    <p class="subtitle">
      Вставте текст вакансії та ваші професійні дані, а потім натисніть кнопку генерації.
    </p>

    <div class="field">
      <label for="vacancyText">1) Текст вакансії</label>
      <textarea id="vacancyText" placeholder="Скопіюйте сюди опис вакансії..."></textarea>
    </div>

    <div class="field">
      <label for="candidateText">2) Досвід і навички кандидата</label>
      <textarea id="candidateText" placeholder="Опишіть досвід, стек технологій, досягнення..."></textarea>
    </div>

    <div class="actions">
      <button id="generateBtn" type="button">Згенерувати</button>
    </div>
    <div id="loadingIndicator" class="loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span>Генеруємо лист...</span>
    </div>

    <section class="result" aria-live="polite">
      <h2>Результат</h2>
      <div id="resultBox" class="result-box">
        Тут з'явиться згенерований супровідний лист.
      </div>
    </section>
  </main>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const resultBox = document.getElementById("resultBox");
    const vacancyText = document.getElementById("vacancyText");
    const candidateText = document.getElementById("candidateText");
    const loadingIndicator = document.getElementById("loadingIndicator");
    const API_KEY = "YOUR_API_KEY";

    generateBtn.addEventListener("click", async () => {
      const vacancy = vacancyText.value.trim();
      const candidate = candidateText.value.trim();

      if (!vacancy || !candidate) {
        resultBox.textContent = "Будь ласка, заповніть обидва поля перед генерацією.";
        return;
      }

      const prompt =
        "Сгенерируй профессиональное сопроводительное письмо на чешском языке на основе вакансии и опыта кандидата.\n\n" +
        "Вакансия:\n" +
        vacancy +
        "\n\n" +
        "Опыт и навыки кандидата:\n" +
        candidate;

      generateBtn.disabled = true;
      loadingIndicator.classList.add("visible");
      resultBox.textContent = "Очікуємо відповідь від Claude...";

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": API_KEY,
            "anthropic-version": "2023-06-01"
          },
          body: JSON.stringify({
            model: "claude-haiku-4-5-20251001",
            max_tokens: 900,
            messages: [
              {
                role: "user",
                content: prompt
              }
            ]
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }

        const data = await response.json();
        const generatedText =
          data?.content?.find((item) => item.type === "text")?.text ||
          "Не вдалося отримати текст листа у відповіді API.";

        resultBox.textContent = generatedText;
      } catch (error) {
        resultBox.textContent =
          "Сталася помилка під час генерації. Перевірте API-ключ, доступ до мережі та налаштування CORS.\n\n" +
          String(error);
      } finally {
        generateBtn.disabled = false;
        loadingIndicator.classList.remove("visible");
      }
    });
  </script>
</body>
</html>
